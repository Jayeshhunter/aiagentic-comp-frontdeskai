apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontdeskai
  labels:
    app: frontdeskai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontdeskai
  template:
    metadata:
      labels:
        app: frontdeskai
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: frontdeskai
          # kind (local/Codespace): frontdeskai:latest loaded via `kind load docker-image`
          # production: substituted by deploy.sh to ${NAMESPACE}-registry.brainupgrade.in/frontdeskai:latest
          image: frontdeskai:latest
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8000
          envFrom:
            # LLM (LLM_PROVIDER, LLM_MODEL, LITELLM_BASE_URL, LITELLM_API_KEY, empty
            # fallback), SECRET_KEY, AUTH_PASSWORD and optional LANGFUSE_* — all
            # written by scripts/deploy.sh from .env and the environment.
            - secretRef:
                name: frontdeskai-secret
          env:
            # Pre-populate demo employees, leave, tickets, expenses, rooms, payslips
            # (see use-case-scenarios.md — set to "false" for a clean instance)
            - name: SEED_DEMO_DATA
              value: "true"
            # Observability config
            - name: OTEL_SERVICE_NAME
              value: "frontdeskai"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.monitoring.svc.cluster.local:4317"
            - name: LOG_LEVEL
              value: "INFO"
            # MCP Leave Server (postgres namespace)
            - name: MCP_LEAVE_URL
              value: "http://mcp-leave.postgres.svc.cluster.local:8001/mcp"
            # Writable home for ONNX model cache (ChromaDB embeddings)
            - name: HOME
              value: "/shared"
          volumeMounts:
            - name: sqlite-data
              mountPath: /shared
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: frontdeskai-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frontdeskai-pvc
  labels:
    app: frontdeskai
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
